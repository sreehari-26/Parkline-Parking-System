  <style>
    :root {
      --ink: #17211c;
      --muted: #77817b;
      --line: #e8ece8;
      --paper: #fff;
      --canvas: #f5f7f4;
      --green: #16834a;
      --green-bg: #dff4e6;
      --red: #d94b4b;
      --red-bg: #fde7e5;
      --yellow: #f1c84b;
      --yellow-bg: #fff5c8;
      --radius: 26px;
      --shadow: 0 24px 80px rgba(27, 44, 33, .10)
    }

    * {
      box-sizing: border-box
    }

    html {
      scroll-behavior: smooth
    }

    body {
      margin: 0;
      background: var(--canvas);
      color: var(--ink);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      overflow-x: hidden
    }

    button,
    input,
    select {
      font: inherit
    }

    button {
      cursor: pointer
    }

    button:focus-visible,
    select:focus-visible,
    input:focus-visible {
      outline: 3px solid var(--c1);
      outline-offset: 3px
    }

    .topbar {
      height: 82px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 clamp(20px, 5vw, 76px);
      background: rgba(255, 255, 255, .82);
      border-bottom: 1px solid var(--c2);
      position: relative;
      z-index: 5
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      font-family: Manrope, sans-serif;
      font-weight: 800;
      letter-spacing: -.06em;
      font-size: 22px
    }

    .brand-mark {
      width: 30px;
      height: 30px;
      border-radius: 10px;
      background: var(--ink);
      display: grid;
      place-items: center;
      color: white
    }

    .brand-mark svg {
      width: 17px;
      height: 17px
    }

    .top-label {
      font-size: 11px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700
    }

    .page {
      min-height: calc(100vh - 82px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 42px 22px 60px
    }

    .postcard {
      width: min(100%, 980px);
      min-height: 570px;
      background: var(--paper);
      border: 1px solid var(--c3);
      border-radius: 32px;
      box-shadow: var(--shadow);
      overflow: hidden;
      position: relative;
      transition: width .45s ease, min-height .45s ease, box-shadow .35s ease
    }

    .postcard::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
      background: linear-gradient(90deg, var(--c4), var(--c5) 45%, var(--c6))
    }

    .panel {
      padding: clamp(26px, 5vw, 58px);
      animation: appear .45s cubic-bezier(.2, .8, .2, 1) both
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(12px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .15em;
      font-weight: 700;
      margin-bottom: 20px
    }

    .eyebrow::before {
      content: "";
      height: 1px;
      width: 24px;
      background: var(--c7)
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0
    }

    h1,
    h2 {
      font-family: Manrope, sans-serif;
      letter-spacing: -.055em
    }

    h1 {
      font-size: clamp(38px, 6vw, 66px);
      line-height: 1.02;
      margin-bottom: 18px;
      font-weight: 700;
      max-width: 660px
    }

    h2 {
      font-size: clamp(28px, 4vw, 42px);
      line-height: 1.1;
      margin-bottom: 12px
    }

    h3 {
      font-family: Manrope, sans-serif;
      letter-spacing: -.03em
    }

    .lead {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.75;
      max-width: 550px
    }

    .home-panel {
      min-height: 565px;
      display: flex;
      flex-direction: column;
      justify-content: center
    }

    .home-layout {
      display: grid;
      grid-template-columns: 1.08fr .92fr;
      gap: 35px;
      align-items: center
    }

    .home-copy {
      padding: 10px 0
    }

    .home-actions {
      display: grid;
      gap: 13px;
      margin-top: 34px;
      max-width: 440px
    }

    .action-card {
      width: 100%;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 19px;
      padding: 19px 20px;
      display: flex;
      align-items: center;
      text-align: left;
      gap: 16px;
      transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease
    }

    .action-card:hover {
      transform: translateY(-3px);
      border-color: var(--c8);
      box-shadow: 0 12px 28px var(--c9)
    }

    .action-icon {
      width: 46px;
      height: 46px;
      border-radius: 15px;
      display: grid;
      place-items: center;
      background: var(--c10);
      flex-shrink: 0
    }

    .action-icon svg {
      width: 22px;
      height: 22px;
      stroke: var(--c11)
    }

    .action-text {
      flex: 1
    }

    .action-text strong {
      display: block;
      font-size: 15px;
      margin-bottom: 5px
    }

    .action-text span {
      font-size: 12px;
      color: var(--muted)
    }

    .arrow {
      font-size: 20px;
      color: var(--c12);
      transition: transform .25s ease
    }

    .action-card:hover .arrow {
      transform: translateX(4px)
    }

    .home-visual {
      min-height: 365px;
      border-radius: 25px;
      background: var(--c13);
      position: relative;
      overflow: hidden;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .visual-glow {
      position: absolute;
      width: 290px;
      height: 290px;
      border-radius: 50%;
      background: var(--c14);
      filter: blur(1px)
    }

    .mini-map {
      position: relative;
      width: 100%;
      max-width: 310px;
      aspect-ratio: 1/1.04;
      background: #fff;
      border: 1px solid var(--c15);
      border-radius: 22px;
      padding: 18px;
      box-shadow: 0 18px 42px var(--c16);
      transform: rotate(-3deg)
    }

    .map-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 17px;
      font-size: 11px;
      font-weight: 700
    }

    .live-pill {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--c17);
      background: var(--c18);
      border-radius: 999px;
      padding: 6px 8px
    }

    .mini-slots {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 9px;
      height: 65%
    }

    .mini-slot {
      border-radius: 8px;
      background: var(--c19);
      border: 1px solid var(--c20);
      position: relative
    }

    .mini-slot::after {
      content: "";
      position: absolute;
      left: 20%;
      right: 20%;
      top: 18%;
      bottom: 18%;
      border: 1.5px solid var(--c21);
      border-radius: 4px
    }

    .mini-slot.occupied {
      background: #f9d9d6;
      border-color: #f0c0bc
    }

    .mini-slot.occupied::after {
      border-color: #d64c48
    }

    .mini-slot.selected {
      background: #ffed9d;
      border-color: #ebce58
    }

    .mini-slot.selected::after {
      border-color: #b08b09
    }

    .map-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 15px;
      color: var(--muted);
      font-size: 10px
    }

    .map-foot strong {
      color: var(--ink);
      font-size: 17px
    }

    .form-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 50px;
      gap: 10px;
      align-items: end
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 9px
    }

    .field label {
      font-size: 12px;
      font-weight: 700;
      color: var(--c22)
    }

    select,
    input[type="date"],
    input[type="time"] {
      width: 100%;
      height: 51px;
      border: 1px solid var(--c23);
      border-radius: 13px;
      background: #fff;
      color: var(--ink);
      padding: 0 14px;
      outline: none;
      transition: border-color .2s, box-shadow .2s
    }

    select:focus,
    input:focus {
      border-color: var(--c24);
      box-shadow: 0 0 0 4px var(--c25)
    }

    .camera-button {
      height: 51px;
      width: 50px;
      border: 1px solid var(--c23);
      border-radius: 13px;
      background: #fff;
      display: grid;
      place-items: center;
      color: var(--c26);
      transition: background .2s, border-color .2s
    }

    .camera-button:hover {
      background: var(--c27);
      border-color: var(--c28)
    }

    .camera-button svg {
      width: 21px;
      height: 21px
    }

    .controls {
      display: grid;
      grid-template-columns: 1.2fr 1fr 1fr;
      gap: 14px;
      margin-top: 25px
    }

    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 20px;
      margin-bottom: 25px
    }

    .section-heading .lead {
      font-size: 13px;
      margin-bottom: 0
    }

    .back-button {
      border: 1px solid var(--line);
      background: white;
      border-radius: 999px;
      padding: 10px 15px;
      font-size: 12px;
      color: var(--c29);
      white-space: nowrap;
      transition: background .2s
    }

    .back-button:hover {
      background: var(--c30)
    }

    .location-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      margin-bottom: 30px;
      flex-wrap: wrap
    }

    .location-title {
      font-family: Manrope, sans-serif;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -.03em
    }

    .location-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 5px
    }

    .legend {
      display: flex;
      gap: 13px;
      align-items: center;
      flex-wrap: wrap
    }

    .legend span {
      font-size: 11px;
      color: var(--c31);
      display: flex;
      align-items: center;
      gap: 7px
    }

    .legend i {
      width: 9px;
      height: 9px;
      border-radius: 3px;
      display: inline-block
    }

    .legend .lg-green {
      background: var(--green)
    }

    .legend .lg-red {
      background: var(--red)
    }

    .legend .lg-yellow {
      background: var(--yellow)
    }

    .floor-tag {
      font-size: 10px;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--c32);
      font-weight: 700;
      margin: 23px 0 15px
    }

    .floor-row {
      display: grid;
      grid-template-columns: repeat(10, minmax(0, 1fr));
      gap: 13px
    }

    .slot {
      position: relative;
      height: 82px;
      border: 1px solid transparent;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
      cursor: pointer;
      padding: 0
    }

    .slot.available {
      background: var(--green-bg);
      border-color: var(--c33)
    }

    .slot.available .slot-car {
      stroke: var(--c34)
    }

    .slot.reserved {
      background: var(--red-bg);
      border-color: #f7d2cf;
      cursor: not-allowed
    }

    .slot.reserved .slot-car {
      stroke: #d34c48
    }

    .slot.selected {
      background: var(--yellow-bg);
      border-color: #e9cb51;
      box-shadow: 0 0 0 2px #f7e69d
    }

    .slot.selected .slot-car {
      stroke: #997600
    }

    .slot:hover:not(:disabled) {
      transform: translateY(-4px);
      box-shadow: 0 10px 18px var(--c35);
      filter: saturate(1.05);
      z-index: 2
    }

    .slot:disabled {
      opacity: 1
    }

    .slot svg {
      width: 24px;
      height: 30px;
      fill: none;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .slot-id {
      position: absolute;
      bottom: 7px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .02em;
      color: var(--c36);
      opacity: 0;
      transform: translateY(3px);
      transition: opacity .18s, transform .18s
    }

    .slot:hover .slot-id,
    .slot.selected .slot-id {
      opacity: 1;
      transform: translateY(0)
    }

    .slot-tip {
      position: absolute;
      bottom: calc(100% + 9px);
      left: 50%;
      transform: translate(-50%, 4px);
      white-space: nowrap;
      background: var(--c37);
      color: white;
      padding: 7px 10px;
      border-radius: 7px;
      font-size: 10px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .15s, transform .15s;
      z-index: 10
    }

    .slot:hover .slot-tip {
      opacity: 1;
      transform: translate(-50%, 0)
    }

    .slot-tip::after {
      content: "";
      position: absolute;
      top: 100%;
      left: 50%;
      border: 5px solid transparent;
      border-top-color: var(--c37);
      transform: translateX(-50%)
    }

    .slot-note {
      margin-top: 18px;
      font-size: 11px;
      color: var(--c38);
      display: flex;
      align-items: center;
      gap: 8px
    }

    .slot-note::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--c39)
    }

    .booking-summary {
      margin-top: 34px;
      border: 1px solid var(--c40);
      border-radius: 21px;
      background: var(--c41);
      padding: 24px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 24px;
      align-items: center;
      animation: appear .4s ease both
    }

    .summary-label {
      font-size: 10px;
      letter-spacing: .13em;
      text-transform: uppercase;
      color: var(--c42);
      font-weight: 700;
      margin-bottom: 13px
    }

    .summary-title {
      font-family: Manrope, sans-serif;
      font-weight: 800;
      font-size: 21px;
      letter-spacing: -.04em;
      margin-bottom: 14px
    }

    .summary-meta {
      display: flex;
      gap: 22px;
      flex-wrap: wrap
    }

    .meta-item {
      font-size: 11px;
      color: var(--c38)
    }

    .meta-item strong {
      display: block;
      font-size: 13px;
      color: var(--c43);
      margin-top: 5px
    }

    .price-block {
      border-left: 1px solid var(--c44);
      padding-left: 30px;
      min-width: 155px
    }

    .price-caption {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 5px
    }

    .price {
      font-family: Manrope, sans-serif;
      font-size: 38px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: -.06em
    }

    .price small {
      font-size: 12px;
      letter-spacing: 0;
      color: var(--c38);
      font-weight: 600
    }

    .price-note {
      font-size: 10px;
      color: var(--c38);
      margin-top: 8px
    }

    .summary-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
      grid-column: 1/-1
    }

    .primary-button {
      border: 0;
      border-radius: 999px;
      background: var(--ink);
      color: #fff;
      padding: 15px 23px;
      font-size: 12px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: transform .2s, background .2s, box-shadow .2s
    }

  <style>
    /* ---- Parking rows: centred, even when a floor has fewer than 10 spaces ---- */
    .floor-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 13px
    }

    .floor-row .slot {
      flex: 0 0 calc((100% - 9 * 13px) / 10);
      min-width: 0
    }

    .floor-tag {
      text-align: center
    }

    @media(max-width:800px) {
      .floor-row {
        gap: 10px
      }

      .floor-row .slot {
        flex-basis: calc((100% - 4 * 10px) / 5)
      }
    }

    @media(max-width:480px) {
      .floor-row {
        gap: 9px
      }

      .floor-row .slot {
        flex-basis: calc((100% - 3 * 9px) / 4)
      }
    }

    /* ---- Booking / reservation forms with a date field ---- */
    .booking-controls.cols-6 {
      grid-template-columns: repeat(3, minmax(0, 1fr))
    }

    .booking-controls.cols-4 {
      grid-template-columns: repeat(4, minmax(0, 1fr))
    }

    .booking-controls input[type="date"],
    .booking-controls input[type="time"] {
      min-width: 0;
      width: 100%
    }

    @media(max-width:800px) {

      .booking-controls.cols-6,
      .booking-controls.cols-4 {
        grid-template-columns: 1fr 1fr
      }
    }

    @media(max-width:520px) {

      .booking-controls.cols-6,
      .booking-controls.cols-4 {
        grid-template-columns: 1fr
      }
    }

    /* ---- Admin analytics ---- */
    .an-head-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap
    }

    .an-updated {
      margin-top: 22px;
      font-size: 12px;
      color: var(--muted)
    }

    .an-title {

      font-size: 13px;

      text-transform: uppercase;
      color: var(--muted)
    }

    .an-stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-top: 14px
    }

    .an-stat {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
      background: var(--paper);
      min-width: 0
    }

    .an-stat.accent {
      background: var(--green-bg)
    }

    .an-stat span {
      display: block;
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700
    }

    .an-stat strong {
      display: block;
      margin-top: 8px;
      font-size: 24px;
      color: var(--ink);
      overflow-wrap: anywhere
    }

    .an-stat small {
      display: block;
      margin-top: 4px;
      font-size: 12px;
      color: var(--muted)
    }

    .an-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-top: 22px
    }

    .an-card {
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 20px;
      background: var(--paper);
      min-width: 0
    }

    .an-card.an-wide {
      grid-column: 1 / -1
    }

    .an-card h4 {
      margin: 0 0 14px;
      font-size: 14px;
      color: var(--ink)
    }

    .chart-svg {
      width: 100%;
      height: auto;
      display: block
    }

    .chart-grid {
      stroke: var(--line);
      stroke-width: 1
    }

    .chart-text {
      fill: var(--muted);
      font-size: 10px
    }

    .chart-bar {
      fill: var(--green)
    }

    .chart-bar:hover {
      opacity: .8
    }

    .donut-row {

    .donut {

    }

    .donut-text {

      font-weight: 700
    }

    .donut-legend {

      gap: 6px;

      color: var(--muted)
    }

    .donut-legend strong {

    .hbars {

    }

    .hbar {

    @media(max-width:800px) {
      .an-stats {
        grid-template-columns: repeat(2, minmax(0, 1fr))
      }

      .an-grid {
        grid-template-columns: 1fr
      }
    }
  </style>

</head>

  <template id="analytics-template">
    <div class="panel">
      <div class="section-heading">
        <div>
          <div class="eyebrow">Admin / Analytics</div>
          <h2>Parking analytics.</h2>
          <p class="lead">Revenue, bookings and parking-space numbers, read live from the database.</p>
        </div>
        <div class="an-head-actions">
          <button class="secondary-button" id="analyticsRefresh" type="button">Refresh</button>
          <button class="back-button" data-action="home">← Back home</button>
        </div>
      </div>
      <div id="analyticsBody"></div>

  <script>
    // Parking locations and slots are loaded from MySQL.
    let locations = [];
    let parkingLots = [];
    let slotRequestId = 0;
    let viewSlotRequestId = 0;

    const modelOptions = {
      "Maruti Suzuki": ["Alto 800", "Baleno", "Swift", "Wagon R", "Brezza", "Dzire", "Ertiga", "Fronx", "Grand Vitara", "Celerio", "S-Presso", "Eeco"],
      "Toyota": ["Innova Crysta", "Innova Hycross", "Fortuner", "Glanza", "Urban Cruiser Hyryder", "Etios", "Camry"],
      "Hyundai": ["i10 Nios", "i20", "Aura", "Venue", "Creta", "Verna", "Exter", "Alcazar"],
      "Tata": ["Tiago", "Tigor", "Altroz", "Punch", "Nexon", "Harrier", "Safari"],
      "Mahindra": ["Thar", "Scorpio N", "XUV 3XO", "XUV700", "Bolero"],
      "Honda": ["Amaze", "City", "Elevate"],
      "Kia": ["Sonet", "Seltos", "Carens"],
      "Other": ["Other / Not listed"]
    };

    const $ = id => document.getElementById(id);

    // Same-origin when served by the Parkline server (e.g. on Railway);
    // falls back to localhost if the file is opened directly.
    const API_BASE = location.protocol === "file:" ? "http://localhost:3000/api" : "/api";

    // Only the login token is kept in the browser.
    // Users, vehicles and bookings all live in MySQL.
    const session = {
      get token() {
        try { return localStorage.getItem("parkline_token"); } catch { return null; }
      },
      save(token, user) {
        try {
          localStorage.setItem("parkline_token", token);
          localStorage.setItem("parkline_user", JSON.stringify(user));
        } catch { /* storage unavailable */ }
      },
      clear() {
        try {
          localStorage.removeItem("parkline_token");
          localStorage.removeItem("parkline_user");
        } catch { /* storage unavailable */ }
      },
      savedUser() {
        try { return JSON.parse(localStorage.getItem("parkline_user")); } catch { return null; }
      }
    };

    const state = {
      screen: "home",
      user: session.token ? session.savedUser() : null,
      vehicles: [],   // cache of the logged-in user's vehicles (from MySQL)
      bookings: [],   // cache of the logged-in user's bookings (from MySQL)
      ratePerHour: 50,
      lot: "",
      lotId: null,
      floor: 0,
      date: localDateString(),
      from: nowTime(),
      to: addMinutesToTime(nowTime(), 60).time,
      spot: null,
      spotId: null,
      authMode: "login"
    };

    const screen = $("screen"), toast = $("toast");

    function endSession() {
      session.clear();
      state.user = null;
      state.vehicles = [];
      state.bookings = [];
      updateAccountButton();
    }

    // ----------------------------------
    // API HELPER
    // ----------------------------------

    async function api(path, { method = "GET", body, auth = true } = {}) {
      const headers = {};

      if (body !== undefined) headers["Content-Type"] = "application/json";
      if (auth && session.token) headers["Authorization"] = "Bearer " + session.token;

      let response;

      try {
        response = await fetch(API_BASE + path, {
          method,
          headers,
          body: body !== undefined ? JSON.stringify(body) : undefined
        });
      } catch {
        throw new Error("Could not connect to the Parkline server.");
      }

      const data = await response.json().catch(() => ({}));

      if (!response.ok) {
        if (response.status === 401 && auth && session.token) {
          endSession();

          if (path !== "/auth/me") {
            showToast("Please log in again.");
            loadScreen("auth");
          }
        }

        const error = new Error(data.error || "Request failed (" + response.status + ")");
        error.status = response.status;
        throw error;
      }

      return data;
    }

    // ----------------------------------
    // MAP DATABASE ROWS TO UI OBJECTS
    // ----------------------------------

    const TYPE_LABELS = {
      EV: "EV",
      SCOOTER: "Scooter",
      FOUR_WHEELER: "4 wheel",
      HEAVY: "Heavy"
    };

    function typeLabel(type) {
      return TYPE_LABELS[type] || type;
    }

    function statusLabel(status) {
      const s = String(status || "").toLowerCase();
      return s.charAt(0).toUpperCase() + s.slice(1);
    }

    function mapVehicle(v) {
      return {
        id: String(v.vehicle_id),
        plate: v.vehicle_number,
        rto: v.rto || "",
        type: v.vehicle_type,
        make: v.make,
        model: v.model
      };
    }

    function mapBooking(b) {
      const start = String(b.start_time);
      const end = String(b.end_time);
      const day = new Date(start.replace(" ", "T"));

      return {
        id: b.booking_id,
        lot: b.lot_name,
        floor: floorName(b.floor_number),
        spot: b.slot_number,
        vehicle: b.vehicle_number,
        from: start.slice(11, 16),
        to: end.slice(11, 16),
        date: isNaN(day) ? start.slice(0, 10) : day.toLocaleDateString("en-IN"),
        price: Number(b.amount),
        status: statusLabel(b.status)
      };
    }

    async function loadVehicles() {
      if (!state.user) {
        state.vehicles = [];
        return state.vehicles;
      }

      const rows = await api("/vehicles");
      state.vehicles = rows.map(mapVehicle);

      return state.vehicles;
    }

    async function loadBookings() {
      if (!state.user) {
        state.bookings = [];
        return state.bookings;
      }

      const rows = await api("/bookings");
      state.bookings = rows.map(mapBooking);

      return state.bookings;
    }

    async function loadPricing() {
      try {
        const data = await api("/pricing", { auth: false });
        state.ratePerHour = Number(data.rate_per_hour) || 50;
      } catch {
        /* keep default rate */
      }
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove("show"), 2500);
    }

    function currentVehicles() {
      return state.user ? state.vehicles : [];
    }

    function currentBookings() {
      return state.user ? state.bookings : [];
    }

    function isAdmin() {
      return Boolean(state.user && state.user.is_admin);
    }

    function updateAccountButton() {
      $("accountButtonLabel").textContent = state.user ? state.user.username : "Account";
      $("accountButton").classList.toggle("signed-in", !!state.user);

      // Admins see the same interface in blue instead of green.
      document.documentElement.classList.toggle("admin-theme", isAdmin());
    }

    // Admin home screen: "Book a parking spot" becomes "Show analytics".
    function setupHome() {
      if (!isAdmin()) return;

      const card = screen.querySelector('[data-action="book"]');

      if (!card) return;

      card.dataset.action = "analytics";

      card.querySelector(".action-icon").innerHTML =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>';

      card.querySelector(".action-text").innerHTML =
        "<strong>Show analytics</strong><span>Revenue, bookings and parking-space numbers</span>";
    }

    function loadScreen(name) {
      // These screens need a logged-in user.
      if (["profile", "vehicle", "booking", "analytics"].includes(name) && !state.user) {
        name = "auth";
      }

      // Analytics is for the admin only (the server enforces this as well).
      if (name === "analytics" && !isAdmin()) {
        name = "home";
      }

      state.screen = name;

      const template = $(name + "-template");

      screen.innerHTML = "";
      screen.appendChild(template.content.cloneNode(true));

      if (name === "home") setupHome();
      if (name === "analytics") setupAnalytics();
      if (name === "auth") setupAuth();
      if (name === "profile") renderProfile();
      if (name === "vehicle") setupVehicleForm();
      if (name === "booking") setupBooking();
      if (name === "reservations") setupReservationsView();

      updateAccountButton();

      $("postcard").scrollIntoView({
        behavior: "smooth",
        block: "center"
      });
    }

    function iconCar() {
      return '<svg class="slot-car" viewBox="0 0 24 30" aria-hidden="true"><path d="M5 18.5 3.8 16a2 2 0 0 1-.2-.9v-3.3a2 2 0 0 1 1.2-1.8l2.1-.9 1.5-4.1A2 2 0 0 1 10.3 3h3.4a2 2 0 0 1 1.9 1.4l1.5 4.1 2.1.9a2 2 0 0 1 1.2 1.8v3.3a2 2 0 0 1-.2.9L19 18.5v4H16v-2H8v2H5z"/><path d="M6 13h12M7 16h.1M17 16h.1"/></svg>';
    }

    function floorName(f) {
      return Number(f) === 0 ? "Ground floor · G" : `Level 0${Number(f)}`;
    }

    function timeMinutes(t) {
      const [h, m] = t.split(":").map(Number);
      return h * 60 + m;
    }

    // Duration between the From and To times. If To is earlier than From,
    // the booking ends the next day (e.g. 22:00 to 02:00 = 4 hours).
    function durationHours() {
      if (!state.from || !state.to) return 0;

      let mins = timeMinutes(state.to) - timeMinutes(state.from);

      if (mins < 0) mins += 1440;

      return mins > 0 ? mins / 60 : 0;
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, c => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[c]));
    }

    // ----------------------------------
    // DATE AND TIME HELPERS
    // ----------------------------------

    function localDateString(date = new Date()) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");

      return `${year}-${month}-${day}`;
    }

    function addDays(dateString, days) {
      const [y, m, d] = dateString.split("-").map(Number);

      return localDateString(new Date(y, m - 1, d + days));
    }

    function makeDateTime(time, dayOffset = 0, baseDate = localDateString()) {
      return `${addDays(baseDate, dayOffset)} ${time}:00`;
    }

    function nowTime() {
      const now = new Date();

      return String(now.getHours()).padStart(2, "0") + ":" +
        String(now.getMinutes()).padStart(2, "0");
    }

    function dateLabel(dateString) {
      const [y, m, d] = dateString.split("-").map(Number);

      return new Date(y, m - 1, d).toLocaleDateString("en-IN", {
        day: "2-digit",
        month: "short",
        year: "numeric"
      });
    }

    function startDateTime() {
      return makeDateTime(state.from, 0, state.date);
    }

    function endDateTime() {
      const nextDay = timeMinutes(state.to) < timeMinutes(state.from) ? 1 : 0;

      return makeDateTime(state.to, nextDay, state.date);
    }

    // True if the chosen start is more than 5 minutes in the past.
    function startIsPast() {
      const start = new Date(startDateTime().replace(" ", "T"));

      return start.getTime() < Date.now() - 5 * 60000;
    }

    function addMinutesToTime(time, minutes) {
      const total = timeMinutes(time) + minutes;

      const dayOffset = Math.floor(total / 1440);
      const adjusted = total % 1440;

      const hours = String(Math.floor(adjusted / 60)).padStart(2, "0");
      const mins = String(adjusted % 60).padStart(2, "0");

      return {
        time: `${hours}:${mins}`,
        dayOffset
      };
    }

    // ----------------------------------
    // LOAD PARKING LOCATIONS FROM MYSQL
    // ----------------------------------

    async function fillLocationSelect(select) {
      select.innerHTML = '<option value="">Loading locations...</option>';

      try {
        const response = await fetch(
          API_BASE + "/parking-lots"
        );

        if (!response.ok) {
          throw new Error("Server error: " + response.status);
        }

        const data = await response.json();

        parkingLots = data;
        locations = data.map(lot => lot.lot_name);

        if (!parkingLots.length) {
          select.innerHTML =
            '<option value="">No parking locations available</option>';

          return false;
        }

        let selectedLot = parkingLots.find(
          lot => Number(lot.lot_id) === Number(state.lotId)
        );

        if (!selectedLot) {
          selectedLot = parkingLots[0];
        }

        state.lot = selectedLot.lot_name;
        state.lotId = selectedLot.lot_id;

        select.innerHTML = "";

        parkingLots.forEach(lot => {
          const option = document.createElement("option");

          option.value = lot.lot_id;
          option.textContent = lot.lot_name;

          select.appendChild(option);
        });

        select.value = String(state.lotId);

        return true;

      } catch (error) {
        console.error("Could not load parking locations:", error);

        select.innerHTML =
          '<option value="">Unable to load locations</option>';

        showToast("Could not connect to the Parkline server.");

        return false;
      }
    }

    // ----------------------------------
    // FETCH ACTUAL PARKING SLOTS
    // ----------------------------------

    async function fetchParkingSlots(lotId, floor, startTime, endTime, vehicleType) {
      const params = new URLSearchParams({
        lot_id: lotId,
        floor_number: floor,
        start_time: startTime,
        end_time: endTime
      });

      if (vehicleType) params.set("vehicle_type", vehicleType);

      const response = await fetch(
        `${API_BASE}/parking-slots?${params.toString()}`
      );

      if (!response.ok) {
        const errorData = await response.json().catch(() => ({}));

        throw new Error(
          errorData.error || "Unable to fetch parking slots."
        );
      }

      return await response.json();
    }

    // ----------------------------------
    // AUTHENTICATION
    // ----------------------------------

    function setupAuth() {
      setAuthMode("login");

      $("authForm").addEventListener("submit", async e => {
        e.preventDefault();

        const identity = $("authIdentity").value.trim();
        const password = $("authPassword").value;
        const username = $("authUsername").value.trim();
        const error = $("authError");
        const submit = $("authSubmit");

        error.textContent = "";

        if (state.authMode === "signup") {
          const email = identity.toLowerCase();

          if (!email.includes("@") || !email.includes(".")) {
            error.textContent = "Enter a valid email address.";
            return;
          }

          if (username.length < 3) {
            error.textContent = "Username must contain at least 3 characters.";
            return;
          }

          if (password.length < 6) {
            error.textContent = "Use a password with at least 6 characters.";
            return;
          }
        }

        submit.disabled = true;

        try {
          const data = state.authMode === "signup"
            ? await api("/auth/signup", {
                method: "POST",
                auth: false,
                body: { username, email: identity, password }
              })
            : await api("/auth/login", {
                method: "POST",
                auth: false,
                body: { identity, password }
              });

          session.save(data.token, data.user);

          state.user = data.user;
          state.vehicles = [];
          state.bookings = [];

          showToast(
            state.authMode === "signup"
              ? "Account created. Welcome to Parkline!"
              : "You are logged in."
          );

          loadScreen("profile");

        } catch (err) {
          error.textContent = err.message;
        } finally {
          submit.disabled = false;
        }
      });
    }

    function setAuthMode(mode) {
      state.authMode = mode;

      $("usernameField").classList.toggle("hidden", mode !== "signup");

      $("authTitle").textContent =
        mode === "signup" ? "Create your account." : "Welcome back.";

      $("authLead").textContent =
        mode === "signup"

      $("authIdentity").previousElementSibling.textContent =

      $("authIdentity").placeholder =

          ? "you@example.com"

      $("authPassword").autocomplete =
        mode === "signup" ? "new-password" : "current-password";

      $("authSubmit").textContent =
        mode === "signup" ? "Create account →" : "Log in →";

      document.querySelectorAll(".auth-tab").forEach(b =>
        b.classList.toggle("active", b.dataset.authMode === mode)
      );
    }

    function setupVehicleForm() {

    // ----------------------------------
    // BOOKING SCREEN
    // ----------------------------------

    async function setupBooking() {
      state.spot = null;
      state.spotId = null;

      // Start from the current time and default to a one-hour booking.
      state.date = localDateString();
      state.from = nowTime();
      state.to = addMinutesToTime(state.from, 60).time;

      $("bookingControls").classList.add("hidden");
      $("noVehiclesNotice").classList.add("hidden");

      let vehicles;

      try {
        vehicles = await loadVehicles();
      } catch (err) {
        if (state.screen === "booking") showToast(err.message);
        return;
      }

      if (state.screen !== "booking") return;

      $("bookingControls").classList.toggle("hidden", vehicles.length === 0);
      $("noVehiclesNotice").classList.toggle("hidden", vehicles.length !== 0);

      if (!vehicles.length) return;

      $("bookingVehicle").innerHTML = vehicles.map(v =>
        `<option value="${escapeHtml(v.id)}">${escapeHtml(v.plate)} · ${escapeHtml(v.make)} ${escapeHtml(v.model)} · ${escapeHtml(typeLabel(v.type))}</option>`
      ).join("");

      const locationsLoaded =
        await fillLocationSelect($("location"));

      if (!locationsLoaded || state.screen !== "booking") return;

      $("floor").value = String(state.floor);
      $("bookDate").min = localDateString();
      $("bookDate").max = addDays(localDateString(), 90);
      $("bookDate").value = state.date;
      $("fromTime").value = state.from;
      $("toTime").value = state.to;

      $("location").addEventListener("change", () => {
        const selected = parkingLots.find(
          lot => Number(lot.lot_id) === Number($("location").value)
        );

        if (!selected) return;

        state.lot = selected.lot_name;
        state.lotId = selected.lot_id;
        state.spot = null;

        updateLot();
        hideSummary();
        renderSlots();
      });

      $("floor").addEventListener("change", () => {
        state.floor = Number($("floor").value);
        state.spot = null;

        hideSummary();
        renderSlots();
      });

      $("bookDate").addEventListener("change", () => {
        const min = localDateString();
        const max = addDays(min, 90);

        // Keep the date inside the allowed range.
        if (!$("bookDate").value || $("bookDate").value < min) $("bookDate").value = min;
        if ($("bookDate").value > max) $("bookDate").value = max;

        state.date = $("bookDate").value;
        state.spot = null;

        hideSummary();
        renderSlots();
      });

      $("fromTime").addEventListener("change", () => {
        state.from = $("fromTime").value;
        state.spot = null;

        hideSummary();
        renderSlots();
      });

      $("toTime").addEventListener("change", () => {
        state.to = $("toTime").value;
        state.spot = null;

        hideSummary();
        renderSlots();
      });

      // Slots are filtered by vehicle type, so reload when the vehicle changes.
      $("bookingVehicle").addEventListener("change", () => {
        state.spot = null;

        hideSummary();
        renderSlots();
      });

      updateLot();

      await renderSlots();
    }

    function updateLot() {
      $("lotTitle").textContent = state.lot;

      $("lotSubtitle").textContent =
        "Select an available space · " + floorName(state.floor);

    // ----------------------------------
    // RENDER ACTUAL MYSQL PARKING SLOTS
    // ----------------------------------

    async function renderSlots() {
      const root = $("slotFloors");

      if (!root || !state.lotId) return;

      const requestId = ++slotRequestId;

      root.innerHTML =
        '<div class="empty-state">Loading parking spaces...</div>';

      if (!state.date || durationHours() <= 0) {
        root.innerHTML =
          '<div class="empty-state">Please choose a valid date, start time and end time.</div>';

        return;
      }

      if (startIsPast()) {
        root.innerHTML =
          '<div class="empty-state">That start time has already passed. Choose a later time or another date.</div>';

        return;
      }

      try {
        const startTime = startDateTime();
        const endTime = endDateTime();

        const selectedVehicle = currentVehicles().find(
          v => v.id === $("bookingVehicle").value
        );

        const slots = await fetchParkingSlots(
          state.lotId,
          state.floor,
          startTime,
          endTime,
          selectedVehicle?.type
        );

        // Ignore older responses if the user changed a selection.
        if (requestId !== slotRequestId || state.screen !== "booking") {
          return;
        }

        root.innerHTML = "";

        if (!slots.length) {
          root.innerHTML =
            '<div class="empty-state">No parking spaces for your vehicle type on this floor.</div>';

          return;
        }

        const label = document.createElement("div");

        label.className = "floor-tag";
        label.textContent = floorName(state.floor) + " / PARKING BAY";

        root.appendChild(label);

        // Display database slots in rows of 20.
        for (let group = 0; group < slots.length; group += 20) {
          if (group > 0) {
            const label2 = document.createElement("div");

            label2.className = "floor-tag";
            label2.textContent =
              "SECOND ROW / " + floorName(state.floor).toUpperCase();

            root.appendChild(label2);
          }

          const row = document.createElement("div");

          row.className = "floor-row";

          const groupSlots = slots.slice(group, group + 20);

          groupSlots.forEach(slot => {
            const id = slot.slot_number;
            const reserved = Number(slot.is_reserved) === 1;
            const selected = state.spot === id && !reserved;

            const button = document.createElement("button");

            button.type = "button";

            button.className = "slot " +
              (reserved
                ? "reserved"
                : selected
                  ? "selected"
                  : "available");

            button.disabled = reserved;

            button.setAttribute(
              "aria-label",
              id + " " + (reserved ? "reserved" : selected ? "selected" : "available")
            );

            button.innerHTML = iconCar() +
              `<span class="slot-id">${escapeHtml(id)}</span>
               <span class="slot-tip">${escapeHtml(id)} · ${reserved ? "Reserved" : selected ? "Selected" : "Available"}</span>`;

            button.addEventListener("click", () => {
              if (reserved) return;

              state.spot = id;
              state.spotId = slot.slot_id;

              renderSlots();
              showSummary();
            });

            row.appendChild(button);
          });

          root.appendChild(row);
        }

      } catch (error) {
        if (requestId !== slotRequestId) return;

        console.error("Parking slots error:", error);

        root.innerHTML =
          '<div class="empty-state">Could not load parking spaces. Please check your server and try again.</div>';

        showToast("Unable to load parking slots.");
      }
    }

    async function confirmBooking() {
      if (!state.user) {
        loadScreen("auth");
        return;
      }

      if (!state.spot || !state.spotId || !state.date || durationHours() <= 0) {
        showToast("Please select a spot and a valid date and time range.");
        return;
      }

      if (startIsPast()) {
        showToast("That start time has already passed. Please update the time.");
        return;
      }

      const vehicle = currentVehicles().find(
        v => v.id === $("bookingVehicle").value
      );

      if (!vehicle) {
        showToast("Please select a vehicle.");
        return;
      }

      const button = document.querySelector('[data-action="pay"]');

      if (button) button.disabled = true;

      try {
        await api("/bookings", {
          method: "POST",
          body: {
            vehicle_id: Number(vehicle.id),
            slot_id: state.spotId,
            start_time: startDateTime(),
            end_time: endDateTime()
          }
        });

        state.spot = null;
        state.spotId = null;

        showToast("Reservation confirmed.");

        loadScreen("profile");

      } catch (err) {
        showToast(err.message);

        if (state.screen === "booking") {
          if (button) button.disabled = false;

          // Someone else may have taken the space: refresh availability.
          if (err.status === 409) {
            state.spot = null;
            hideSummary();
            renderSlots();
          }
        }
      }
    }

    // ----------------------------------
    // ADMIN ANALYTICS
    // ----------------------------------

    const fmtMoney = n =>
      "₹" + Number(n || 0).toLocaleString("en-IN", {
        minimumFractionDigits: 0,
        maximumFractionDigits: 2
      });

    const fmtInt = n => Number(n || 0).toLocaleString("en-IN");

    function compactNumber(n) {
      if (n >= 100000) return (n / 100000).toFixed(1).replace(/\.0$/, "") + "L";
      if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, "") + "k";

      return String(Math.round(n * 10) / 10);
    }

    function niceMax(v) {
      if (v <= 0) return 1;

      const exp = Math.pow(10, Math.floor(Math.log10(v)));
      const f = v / exp;

      return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * exp;
    }

    // Vertical bar chart drawn as SVG (no external libraries).
    function barChartSvg(items, format, labelEvery = 1) {
      const W = 600, H = 230, padL = 46, padR = 8, padT = 14, padB = 30;
      const innerW = W - padL - padR;
      const innerH = H - padT - padB;

      const top = niceMax(Math.max(0, ...items.map(i => i.value)));
      const slot = innerW / items.length;
      const barW = Math.max(slot * 0.62, 3);

      let svg = `<svg class="chart-svg" viewBox="0 0 ${W} ${H}" role="img">`;

      for (let i = 0; i <= 4; i++) {
        const y = padT + innerH - (innerH * i) / 4;

        svg += `<line class="chart-grid" x1="${padL}" x2="${W - padR}" y1="${y}" y2="${y}"/>`;
        svg += `<text class="chart-text" x="${padL - 6}" y="${y + 3}" text-anchor="end">${compactNumber((top * i) / 4)}</text>`;
      }

      items.forEach((item, i) => {
        const h = (item.value / top) * innerH;
        const x = padL + i * slot + (slot - barW) / 2;
        const y = padT + innerH - h;

        svg += `<rect class="chart-bar" x="${x}" y="${y}" width="${barW}" height="${Math.max(h, item.value > 0 ? 1 : 0)}" rx="3"><title>${escapeHtml(item.label)}: ${escapeHtml(format(item.value))}</title></rect>`;

        if (i % labelEvery === 0) {
          svg += `<text class="chart-text" x="${x + barW / 2}" y="${H - 10}" text-anchor="middle">${escapeHtml(item.label)}</text>`;
        }
      });

      return svg + "</svg>";
    }

    // Percentage ring for overall occupancy.
    function donutSvg(value, total) {
      const r = 52;
      const c = 2 * Math.PI * r;
      const pct = total > 0 ? Math.min(value / total, 1) : 0;

      return `<svg class="donut" viewBox="0 0 140 140" role="img">
        <circle class="donut-bg" cx="70" cy="70" r="${r}" fill="none" stroke-width="16"/>
        <circle class="donut-fg" cx="70" cy="70" r="${r}" fill="none" stroke-width="16" stroke-linecap="round"
          stroke-dasharray="${c * pct} ${c}" transform="rotate(-90 70 70)"/>
        <text class="donut-text" x="70" y="70" text-anchor="middle" dominant-baseline="central">${Math.round(pct * 100)}%</text>
      </svg>`;
    }

    // Horizontal bars. `total` (optional) makes each bar a share of its own total.
    function hBars(items, max) {
      if (!items.length) return '<div class="empty-state">No data yet.</div>';

      const scale = max || Math.max(1, ...items.map(i => i.value));

      return items.map(i => {
        const base = i.total !== undefined ? (i.total || 1) : scale;
        const pct = Math.min(100, (i.value / base) * 100);

        return `<div class="hbar">
          <div class="hbar-label">${escapeHtml(i.label)}</div>
          <div class="hbar-track"><div class="hbar-fill" style="width:${pct}%"></div></div>
          <div class="hbar-value">${escapeHtml(i.text)}</div>
        </div>`;
      }).join("");
    }

    function statCard(label, value, note, accent) {
      return `<div class="an-stat${accent ? " accent" : ""}">
        <span>${escapeHtml(label)}</span>
        <strong>${escapeHtml(value)}</strong>
        ${note ? `<small>${escapeHtml(note)}</small>` : ""}
      </div>`;
    }

    function renderAnalytics(d) {
      const rev = d.revenue, bk = d.bookings, sl = d.slots;

      const dayItems = d.revenue_by_day.map(r => {
        const [y, m, day] = r.day.split("-").map(Number);

        return {
          label: new Date(y, m - 1, day).toLocaleDateString("en-IN", { day: "2-digit", month: "short" }),
          value: r.revenue
        };
      });

      const hourItems = d.bookings_by_hour.map(r => ({
        label: String(r.hour).padStart(2, "0"),
        value: r.bookings
      }));

      const typeBars = sl.by_type.map(r => ({
        label: typeLabel(r.vehicle_type),
        value: r.occupied,
        total: r.total,
        text: `${r.occupied} / ${r.total} in use`
      }));

      const lotBars = d.by_lot.map(r => ({
        label: r.lot_name,
        value: r.revenue,
        text: fmtMoney(r.revenue)
      }));

      const statusBars = d.status_breakdown.map(r => ({
        label: statusLabel(r.status),
        value: r.total,
        text: fmtInt(r.total)
      }));

      const lotRows = d.by_lot.map(r => `
        <tr>
          <td>${escapeHtml(r.lot_name)}</td>
          <td>${fmtInt(r.total_slots)}</td>
          <td>${fmtInt(r.occupied)}</td>
          <td>${fmtInt(r.available)}</td>
          <td>${fmtInt(r.bookings)}</td>
          <td>${fmtMoney(r.revenue)}</td>
        </tr>`).join("");

      const recentRows = d.recent_bookings.map(r => `
        <tr>
          <td>#${escapeHtml(r.booking_id)}</td>
          <td>${escapeHtml(r.username)}</td>
          <td>${escapeHtml(r.lot_name)}</td>
          <td>${escapeHtml(floorName(r.floor_number))} · ${escapeHtml(r.slot_number)}</td>
          <td>${escapeHtml(r.vehicle_number)}</td>
          <td>${escapeHtml(String(r.start_time).slice(0, 16))}</td>
          <td>${fmtMoney(r.amount)}</td>
          <td>${escapeHtml(statusLabel(r.status))}</td>
        </tr>`).join("");

      return `
        <div class="an-updated">Updated ${escapeHtml(nowTime())} · rate ${fmtMoney(d.rate_per_hour)} per hour</div>

        <h3 class="an-title">Revenue</h3>
        <div class="an-stats">
          ${statCard("Total revenue", fmtMoney(rev.total), "All bookings except cancelled", true)}
          ${statCard("This month", fmtMoney(rev.month))}
          ${statCard("Today", fmtMoney(rev.today))}
          ${statCard("Average booking", fmtMoney(rev.average_booking))}
          ${statCard("Payments received", fmtMoney(rev.collected))}
          ${statCard("Payments pending", fmtMoney(rev.pending))}
          ${statCard("Refunded", fmtMoney(rev.refunded))}
          ${statCard("Bookings counted", fmtInt(bk.valid), fmtInt(bk.cancelled) + " cancelled")}
        </div>

        <h3 class="an-title">Parking slots</h3>
        <div class="an-stats">
          ${statCard("Active slots", fmtInt(sl.active), fmtInt(sl.inactive) + " inactive")}
          ${statCard("In use right now", fmtInt(sl.occupied))}
          ${statCard("Available right now", fmtInt(sl.available))}
          ${statCard("Upcoming bookings", fmtInt(bk.upcoming), fmtInt(bk.active_now) + " active now")}
          ${statCard("Registered users", fmtInt(d.people.users))}
          ${statCard("Registered vehicles", fmtInt(d.people.vehicles))}
        </div>

        <div class="an-grid">
          <div class="an-card an-wide">
            <h4>Revenue · last 14 days</h4>
            ${barChartSvg(dayItems, fmtMoney, 1)}
          </div>

          <div class="an-card an-wide">
            <h4>Bookings by start hour</h4>
            ${barChartSvg(hourItems, v => fmtInt(v) + " bookings", 3)}
          </div>

          <div class="an-card">
            <h4>Slot occupancy right now</h4>
            <div class="donut-row">
              ${donutSvg(sl.occupied, sl.active)}
              <div class="donut-legend">
                <div><strong>${fmtInt(sl.occupied)}</strong> in use</div>
                <div><strong>${fmtInt(sl.available)}</strong> available</div>
                <div><strong>${fmtInt(sl.active)}</strong> active slots</div>
              </div>
            </div>
            <div class="hbars">${hBars(typeBars)}</div>
          </div>

          <div class="an-card">
            <h4>Revenue by location</h4>
            <div class="hbars">${hBars(lotBars)}</div>
          </div>

          <div class="an-card an-wide">
            <h4>Bookings by status</h4>
            <div class="hbars">${hBars(statusBars)}</div>
          </div>
        </div>

        <h3 class="an-title">Locations in numbers</h3>
        <div class="an-table-wrap">
          <table class="an-table">
            <thead><tr><th>Location</th><th>Slots</th><th>In use</th><th>Available</th><th>Bookings</th><th>Revenue</th></tr></thead>
            <tbody>${lotRows || '<tr><td colspan="6">No locations yet.</td></tr>'}</tbody>
          </table>
        </div>

        <h3 class="an-title">Latest bookings</h3>
        <div class="an-table-wrap">
          <table class="an-table">
            <thead><tr><th>ID</th><th>User</th><th>Location</th><th>Space</th><th>Vehicle</th><th>Start</th><th>Amount</th><th>Status</th></tr></thead>
            <tbody>${recentRows || '<tr><td colspan="8">No bookings yet.</td></tr>'}</tbody>
          </table>
        </div>
      `;
    }

    function setupAnalytics() {
      $("analyticsRefresh").addEventListener("click", loadAnalytics);

      loadAnalytics();
    }

    async function loadAnalytics() {
      const body = $("analyticsBody");

      if (!body) return;

      body.innerHTML = '<div class="empty-state">Loading analytics...</div>';

      try {
        const data = await api("/admin/analytics");

        if (state.screen !== "analytics") return;

        body.innerHTML = renderAnalytics(data);

      } catch (err) {
        if (state.screen !== "analytics") return;

        body.innerHTML =
          `<div class="empty-state">${escapeHtml(err.message)}</div>`;
      }
    }

    // ----------------------------------
    // GLOBAL CLICK EVENTS
    // ----------------------------------

    screen.addEventListener("click", e => {
      const authMode =
        e.target.closest("[data-auth-mode]")?.dataset.authMode;

      if (authMode) {
        setAuthMode(authMode);
        return;
      }

      const remove =
        e.target.closest("[data-remove-vehicle]")?.dataset.removeVehicle;

      if (remove) {
        api("/vehicles/" + encodeURIComponent(remove), { method: "DELETE" })
          .then(() => {
            showToast("Vehicle removed.");

            if (state.screen === "profile") renderProfile();
          })
          .catch(err => showToast(err.message));

        return;
      }

      const action =
        e.target.closest("[data-action]")?.dataset.action;

      if (action === "book") {
        if (!state.user) loadScreen("auth");
        else loadScreen("booking");
      }

      if (action === "reservations") {
        loadScreen("reservations");
      }

      if (action === "analytics") {
        loadScreen("analytics");
      }

      if (action === "home") {
        loadScreen("home");
      }

      if (action === "profile") {
        if (state.user) loadScreen("profile");
        else loadScreen("auth");
      }

      if (action === "add-vehicle") {
        if (state.user) loadScreen("vehicle");
        else loadScreen("auth");
      }

      if (action === "logout") {
        endSession();

        showToast("You have logged out.");

        loadScreen("home");
      }
    });

    $("accountButton").addEventListener("click", () =>
      loadScreen(state.user ? "profile" : "auth")
    );

    // ----------------------------------
    // INITIAL LOAD
    // ----------------------------------

    async function init() {
      loadScreen("home");
      loadPricing();

      // If a login token is saved, confirm with the server that it is still valid.
      if (session.token) {
        try {
          const data = await api("/auth/me");

          const wasAdmin = isAdmin();

          state.user = data.user;
          session.save(session.token, data.user);

          // Re-draw the home screen if the saved login turned out different.
          if (state.screen === "home" && wasAdmin !== isAdmin()) loadScreen("home");
        } catch {
          /* api() already cleared an invalid session */
        }

        updateAccountButton();
      }
    }

    init();

    // ----------------------------------
    // CUSTOM CURSOR
    // ----------------------------------

    const cursor = $("cursorRing");

    if (window.matchMedia("(pointer:fine)").matches) {
      document.addEventListener("mousemove", e => {
        cursor.style.left = e.clientX + "px";
        cursor.style.top = e.clientY + "px";

        cursor.classList.add("active");
      });

      document.addEventListener("mouseleave", () =>
        cursor.classList.remove("active")
      );

      document.addEventListener("mouseover", e => {
        if (e.target.closest("button,select,input")) {
          cursor.classList.add("big");
        } else {
          cursor.classList.remove("big");
        }
      });
    }
  </script>

</body>

</html>
